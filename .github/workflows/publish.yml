name: publish

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Check repository contracts
        run: npm test
      - name: Require the release commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Release tags must point to a commit already merged into main.'
            exit 1
          fi
      - name: Install current npm CLI
        run: npm install -g npm@11.5.2
      - name: Publish first release with npm token
        if: env.NPM_TOKEN != ''
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" --location=user
          npm publish --provenance --access public --registry=https://registry.npmjs.org/
      - name: Publish with npm Trusted Publisher
        if: env.NPM_TOKEN == ''
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org/
